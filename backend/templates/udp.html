<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UDP packets</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
        th { background: #eee; }
        button { margin-bottom: 1rem; padding: 0.5rem 1rem; }
        td { white-space: nowrap; }
    </style>
</head>
<body>
    <h1>UDP packets</h1>
    <button type="button" onclick="location.reload()">Refresh</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Sense ID (src)</th>
                <th>Gateway timestamp (UTC)</th>
                <th>Sense → Sink delay</th>
                <th>Backend timestamp (UTC)</th>
                <th>Payload: first 16 bytes</th>
            </tr>
        </thead>
        <tbody>
        {% for row in packets %}
            <tr>
                <td>{{ row["id"] }}</td>
                <td>{{ row["src"] }}</td>
                <td>{{ row["gw_timestamp"] }}</td>
                <td>{{ row["travel_time"] }}</td>
                <td>{{ row["backend_timestamp"] }}</td>
                <td>{{ row["payload"] }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</body>
</html>
